<div class="container mx-auto p-4 sm:p-6 md:p-8 bg-gray-100">

    <div class="bg-white rounded-lg shadow-xl overflow-hidden">

        <div class="bg-gray-800 p-4 flex justify-between items-center">
            <h2 id="tituloCadastro" class="text-xl font-bold text-white">Cadastro de Candidato</h2>
        </div>

        <div class="p-6">
            <form id="formCadastro" class="needs-validation" novalidate>

                <section class="mb-8">
                    <h3 class="text-lg font-semibold text-gray-800 border-b border-gray-300 pb-2 mb-6">Dados Pessoais</h3>
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-x-6 gap-y-4">

                        <div class="col-span-12">
                            <label for="nome" class="block text-sm font-medium text-gray-700">Nome completo do candidato <span class="text-red-500">*</span></label>
                            <input type="text" id="nome" name="nome" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" required>
                        </div>

                        <div class="col-span-12 md:col-span-6">
                            <label for="cpf" class="block text-sm font-medium text-gray-700">CPF do candidato (opcional)</label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm cpf-mask" id="cpf" name="cpfCandidato">
                        </div>

                        <div class="col-span-12 md:col-span-6">
                            <label for="dataNascimento" class="block text-sm font-medium text-gray-700">Data de nascimento <span class="text-red-500">*</span></label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm datepicker" id="dataNascimento" name="dataNascimento" placeholder="DD/MM/AAAA" required>
                        </div>

                        <div class="col-span-12 md:col-span-8">
                            <label for="nomeMae" class="block text-sm font-medium text-gray-700">Nome completo da mãe <span class="text-red-500">*</span></label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" id="nomeMae" name="nomeMae" required>
                        </div>
                        <div class="col-span-12 md:col-span-4">
                            <label for="cpfMae" class="block text-sm font-medium text-gray-700">CPF da mãe</label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm cpf-mask" id="cpfMae" name="cpfMae">
                        </div>

                        <div class="col-span-12 md:col-span-8">
                            <label for="nomePai" class="block text-sm font-medium text-gray-700">Nome completo do pai</label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" id="nomePai" name="nomePai">
                        </div>
                        <div class="col-span-12 md:col-span-4">
                            <label for="cpfPai" class="block text-sm font-medium text-gray-700">CPF do pai</label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm cpf-mask" id="cpfPai" name="cpfPai">
                        </div>

                        <div class="col-span-12 md:col-span-8">
                            <label for="responsavel" class="block text-sm font-medium text-gray-700">Responsável legal <span class="text-red-500">*</span></label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" id="responsavel" name="responsavelLegal" required>
                        </div>
                        <div class="col-span-12 md:col-span-4">
                            <label for="cpfResponsavel" class="block text-sm font-medium text-gray-700">CPF do responsável legal <span class="text-red-500">*</span></label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm cpf-mask" id="cpfResponsavel" name="cpfResponsavel" required>
                        </div>

                        <div class="col-span-12 md:col-span-4">
                            <label for="telefone1" class="block text-sm font-medium text-gray-700">Telefone 1 <span class="text-red-500">*</span></label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm phone-mask" id="telefone1" name="telefone1" required>
                        </div>
                        <div class="col-span-12 md:col-span-4">
                            <label for="telefone2" class="block text-sm font-medium text-gray-700">Telefone 2</label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm phone-mask" id="telefone2" name="telefone2">
                        </div>
                        <div class="col-span-12 md:col-span-4">
                            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                            <input type="email" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" id="email" name="email">
                        </div>

                        <div class="col-span-12">
                            <label class="block text-sm font-medium text-gray-700">Meio de contato preferencial:</label>
                            <div class="mt-2 flex items-center space-x-6">
                                <div class="flex items-center">
                                    <input id="isWhatsapp" name="isWhatsapp" type="checkbox" value="true" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    <label for="isWhatsapp" class="ml-2 block text-sm text-gray-900">WhatsApp</label>
                                </div>
                                <div class="flex items-center">
                                    <input id="isLigacao" name="isLigacao" type="checkbox" value="true" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    <label for="isLigacao" class="ml-2 block text-sm text-gray-900">Ligação</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="mb-8">
                    <h3 class="text-lg font-semibold text-gray-800 border-b border-gray-300 pb-2 mb-4">Deficiência / TEA / AH</h3>
                    <div class="flex items-center space-x-6 mb-4">
                        <label class="text-sm font-medium text-gray-700">Possui condição de PCD / AH / SD?</label>
                        <div class="flex items-center">
                            <input id="pcdSim" name="pcd" type="radio" value="sim" class="h-4 w-4 border-gray-300 text-blue-600 focus:ring-blue-500">
                            <label for="pcdSim" class="ml-2 block text-sm text-gray-900">Sim</label>
                        </div>
                        <div class="flex items-center">
                            <input id="pcdNao" name="pcd" type="radio" value="não" class="h-4 w-4 border-gray-300 text-blue-600 focus:ring-blue-500" checked>
                            <label for="pcdNao" class="ml-2 block text-sm text-gray-900">Não</label>
                        </div>
                    </div>
                    <div id="deficienciaContainer" style="display: none;" class="bg-gray-50 border border-gray-200 p-4 rounded-md">
                        <h4 class="font-semibold mb-3 text-gray-700">Tipo(s) de condição</h4>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="flex items-center"><input type="checkbox" name="defFisica" id="defFisica" value="true" class="h-4 w-4 rounded"><label for="defFisica" class="ml-2 text-sm">Física</label></div>
                            <div class="flex items-center"><input type="checkbox" name="defAuditiva" id="defAuditiva" value="true" class="h-4 w-4 rounded"><label for="defAuditiva" class="ml-2 text-sm">Auditiva</label></div>
                            <div class="flex items-center"><input type="checkbox" name="defIntelectual" id="defIntelectual" value="true" class="h-4 w-4 rounded"><label for="defIntelectual" class="ml-2 text-sm">Intelectual</label></div>
                            <div class="flex items-center"><input type="checkbox" name="defTEA" id="defTEA" value="true" class="h-4 w-4 rounded"><label for="defTEA" class="ml-2 text-sm">TEA</label></div>
                            <div class="flex items-center"><input type="checkbox" name="defAltasHabilidades" id="defAH" value="true" class="h-4 w-4 rounded"><label for="defAH" class="ml-2 text-sm">Altas Habilidades</label></div>
                        </div>
                        <div class="mt-4">
                            <label for="outroDeficiencia" class="block text-sm font-medium text-gray-700">Outro (especificar):</label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" id="outroDeficiencia" name="defOutro">
                        </div>
                    </div>
                </section>

                <div class="bg-blue-600 text-white p-4 rounded-lg mb-8" role="group" aria-labelledby="vinculo-pm-title">
                    <h3 id="vinculo-pm-title" class="text-lg font-semibold border-b border-blue-400 pb-2 mb-4">Vínculo PM</h3>
                    <div class="flex items-center space-x-6 mb-4">
                        <label class="text-sm font-medium">É filho ou neto de policial militar (PMPB)? <span class="text-yellow-300">*</span></label>
                        <div class="flex items-center">
                            <input id="pmilitarSim" name="pmilitar" type="radio" value="Sim" class="h-4 w-4 border-gray-300 text-yellow-400 focus:ring-yellow-400">
                            <label for="pmilitarSim" class="ml-2 block text-sm">Sim</label>
                        </div>
                        <div class="flex items-center">
                            <input id="pmilitarNao" name="pmilitar" type="radio" value="Não" class="h-4 w-4 border-gray-300 text-yellow-400 focus:ring-yellow-400" checked>
                            <label for="pmilitarNao" class="ml-2 block text-sm">Não</label>
                        </div>
                    </div>
                    <div id="frameMilitar" style="display: none;" class="grid grid-cols-1 md:grid-cols-3 gap-x-6">
                        <div class="md:col-span-2">
                            <label for="nomePM" class="block text-sm font-medium">Nome completo do parente militar:</label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 bg-gray-100 rounded-md shadow-sm text-gray-800" id="nomePM" name="nomePM">
                        </div>
                        <div>
                            <label for="matriculaPM" class="block text-sm font-medium">Matrícula do parente militar:</label>
                            <input type="text" class="mt-1 block w-full p-2 border border-gray-300 bg-gray-100 rounded-md shadow-sm text-gray-800" id="matriculaPM" name="matriculaPM">
                        </div>
                    </div>
                </div>

                <section id="frameTurmaPmilitar" style="display: none;" class="mb-8 border border-green-300 bg-green-50 p-4 rounded-lg">
                    <h3 class="text-lg font-semibold text-green-800 border-b border-green-200 pb-2 mb-4">Turmas Disponíveis (Cota PMPB)</h3>
                    <div id="turmaPmilitarOptions" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <p class="text-gray-500">Carregando turmas...</p>
                    </div>
                </section>
                <section id="frameTurmaAmpla" class="mb-8 border border-blue-300 bg-blue-50 p-4 rounded-lg">
                    <h3 class="text-lg font-semibold text-blue-800 border-b border-blue-200 pb-2 mb-4">Turmas Disponíveis (Ampla Concorrência)</h3>
                    <div id="turmaAmplaOptions" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <p class="text-gray-500">Carregando turmas...</p>
                    </div>
                </section>

                <section class="mb-8">
                    <h3 class="text-lg font-semibold text-gray-800 border-b border-gray-300 pb-2 mb-6">Documentação</h3>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="border border-gray-200 rounded-lg p-4">
                            <h4 class="font-semibold mb-3 text-gray-700">Documentação - Cota Militar</h4>
                            <div class="space-y-2">
                                <div class="flex items-center"><input type="checkbox" id="docMil1" name="docIdentidadeFuncional" value="true" class="h-4 w-4 rounded"><label for="docMil1" class="ml-2 text-sm">Cópia da Identidade Funcional do PM</label></div>
                                <div class="flex items-center"><input type="checkbox" id="docMil2" name="docComprovacaoDependencia" value="true" class="h-4 w-4 rounded"><label for="docMil2" class="ml-2 text-sm">Comprovação legal de dependência</label></div>
                                <div class="flex items-center"><input type="checkbox" id="docMil3" name="docCertidaoObito" value="true" class="h-4 w-4 rounded"><label for="docMil3" class="ml-2 text-sm">Certidão de óbito (militar falecido)</label></div>
                            </div>
                        </div>
                        <div class="border border-gray-200 rounded-lg p-4">
                            <h4 class="font-semibold mb-3 text-gray-700">Documentação - PCD</h4>
                            <div class="space-y-2">
                                <div class="flex items-center"><input type="checkbox" id="docPcd1" name="docLaudoMedico" value="true" class="h-4 w-4 rounded"><label for="docPcd1" class="ml-2 text-sm">Apresentação de laudo médico atualizado</label></div>
                            </div>
                        </div>
                        <div class="lg:col-span-2 border border-gray-200 rounded-lg p-4">
                            <h4 class="font-semibold mb-3 text-gray-700">Documentação Geral</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div class="flex items-center"><input type="checkbox" id="docGeral1" name="docDeclaracaoEscola" value="true" class="h-4 w-4 rounded"><label for="docGeral1" class="ml-2 text-sm">Declaração da escola de origem</label></div>
                                <div class="flex items-center"><input type="checkbox" id="docGeral2" name="docIdentidadeResponsavel" value="true" class="h-4 w-4 rounded"><label for="docGeral2" class="ml-2 text-sm">Identidade do responsável legal</label></div>
                                <div class="flex items-center"><input type="checkbox" id="docGeral3" name="docCertidaoNascimento" value="true" class="h-4 w-4 rounded"><label for="docGeral3" class="ml-2 text-sm">Certidão/RG/CPF do candidato</label></div>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="flex justify-end items-center mt-8 pt-6 border-t">
                    <button type="button" id="btnLimparForm" class="px-6 py-2 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 mr-4">Limpar Formulário</button>
                    <button type="submit" id="btnImprimirFicha" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 mr-4"><i class="bi bi-printer mr-1"></i> Imprimir Ficha</button>
                    <button type="submit" id="btnGerarPdf" class="px-6 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700"><i class="bi bi-printer mr-1"></i> Gerar PDF</button>
                </div>
            </form>
        </div>
    </div>
</div>
